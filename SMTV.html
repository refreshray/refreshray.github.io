<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Samsung Tizen TV IPTV Test</title>
    
    <!-- โหลด Video.js CSS -->
    <link href="https://vjs.zencdn.net/8.10.0/video-js.css" rel="stylesheet" />

    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000000;
            color: #ffffff;
            font-family: Arial, sans-serif;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
        }

        #my-video {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
        }

        /* กล่อง Log มุมขวาบน ให้มองเห็นชัดเจน */
        #logBox {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 450px;
            max-height: 300px;
            background: rgba(0, 0, 0, 0.9);
            border: 2px solid #00ffcc;
            padding: 15px;
            font-size: 14px;
            font-family: monospace;
            overflow-y: auto;
            z-index: 9999;
            border-radius: 8px;
            color: #00ffcc;
        }

        /* ป้ายแสดงชื่อช่องด้านล่างซ้าย */
        #infoBox {
            position: absolute;
            bottom: 30px;
            left: 30px;
            background: rgba(0, 0, 0, 0.8);
            border: 1px solid #444;
            padding: 15px 25px;
            z-index: 9999;
            border-radius: 8px;
            font-size: 20px;
            color: #ffcc00;
        }
    </style>
</head>
<body>

    <!-- Video.js Player Element -->
    <video
        id="my-video"
        class="video-js vjs-big-play-centered"
        controls
        preload="auto"
        autoplay
        playsinline
    ></video>

    <!-- Log Panel -->
    <div id="logBox"><b>System Logs:</b><br></div>

    <!-- Info Box -->
    <div id="infoBox">กำลังเตรียมระบบ...</div>

    <!-- โหลด Video.js JavaScript Library -->
    <script src="https://vjs.zencdn.net/8.10.0/video.min.js"></script>

    <script>
        const logBox = document.getElementById('logBox');
        const infoBox = document.getElementById('infoBox');

        function log(msg) {
            console.log(msg);
            logBox.innerHTML += `> ${msg}<br>`;
            logBox.scrollTop = logBox.scrollHeight;
        }

        log("Script started successfully.");

        // รายการช่อง
        const playlist = [
            {
                name: "MAX 1 (ดูสดฟุตบอลลีก)",
                url: "https://api.plus-server.sbs/play.php?key=1234&id=1776175&server=ecdn&source=bontv"
            },
            {
                name: "MAX 2 (ดูสดฟุตบอลลีก)",
                url: "https://api.plus-server.sbs/play.php?key=1234&id=1776176&server=ecdn&source=bontv"
            }
        ];

        let currentIndex = 0;
        let player = null;

        // รอให้หน้าเว็บโหลดสมบูรณ์ก่อนสร้าง Player
        window.addEventListener('DOMContentLoaded', (event) => {
            try {
                log("Initializing Video.js player...");
                player = videojs('my-video', {
                    fluid: false,
                    responsive: true,
                    autoplay: true
                });

                player.ready(function() {
                    log("Player is ready.");
                    loadChannel(0);
                });

                player.on('error', function() {
                    const err = player.error();
                    log("Player Error: " + (err ? err.message : "Unknown") + " (code: " + (err ? err.code : "?") + ")");
                });

            } catch (e) {
                log("Init Exception: " + e.message);
            }
        });

        function loadChannel(index) {
            try {
                currentIndex = index;
                const channel = playlist[currentIndex];
                
                infoBox.innerText = `ช่อง: ${channel.name} [ซ้าย/ขวา เปลี่ยนช่อง]`;
                log(`Loading channel: ${channel.name}`);
                log(`URL: ${channel.url}`);

                player.src({
                    src: channel.url,
                    type: 'application/x-mpegURL'
                });

                player.play().catch(e => {
                    log("Play blocked/error: " + e.message);
                });
            } catch (e) {
                log("LoadChannel Exception: " + e.message);
            }
        }

        // ควบคุมผ่านรีโมท / คีย์บอร์ด
        window.addEventListener('keydown', function(e) {
            log("Key pressed code: " + e.keyCode);
            
            switch(e.keyCode) {
                case 13: // Enter / OK
                    if (player.paused()) {
                        player.play();
                    } else {
                        player.pause();
                    }
                    break;
                case 37: // LEFT arrow (ช่องก่อนหน้า)
                    let prevIndex = (currentIndex - 1 + playlist.length) % playlist.length;
                    loadChannel(prevIndex);
                    break;
                case 39: // RIGHT arrow (ช่องถัดไป)
                    let nextIndex = (currentIndex + 1) % playlist.length;
                    loadChannel(nextIndex);
                    break;
                case 10009: // Return / Back บน Samsung TV
                    try {
                        tizen.application.getCurrentApplication().exit();
                    } catch (err) {
                        window.history.back();
                    }
                    break;
            }
        });
    </script>
</body>
</html>
