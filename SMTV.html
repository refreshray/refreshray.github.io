<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Samsung Tizen TV IPTV Test (HLS.js)</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000000;
            color: #ffffff;
            font-family: Arial, sans-serif;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
        }

        #videoPlayer {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            background-color: #000;
        }

        #logBox {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 480px;
            max-height: 300px;
            background: rgba(0, 0, 0, 0.9);
            border: 2px solid #00ffcc;
            padding: 15px;
            font-size: 13px;
            font-family: monospace;
            overflow-y: auto;
            z-index: 9999;
            border-radius: 8px;
            color: #00ffcc;
        }

        #infoBox {
            position: absolute;
            bottom: 30px;
            left: 30px;
            background: rgba(0, 0, 0, 0.8);
            border: 1px solid #444;
            padding: 15px 25px;
            z-index: 9999;
            border-radius: 8px;
            font-size: 20px;
            color: #ffcc00;
        }
    </style>
</head>
<body>

    <!-- ใช้ Video Element ธรรมดา ควบคุมด้วย Hls.js -->
    <video id="videoPlayer" controls autoplay playsinline></video>

    <div id="logBox"><b>System Logs:</b><br></div>
    <div id="infoBox">กำลังเตรียมระบบ...</div>

    <!-- โหลด Hls.js เวอร์ชันล่าสุด -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

    <script>
        const logBox = document.getElementById('logBox');
        const infoBox = document.getElementById('infoBox');
        const video = document.getElementById('videoPlayer');

        function log(msg) {
            console.log(msg);
            logBox.innerHTML += `> ${msg}<br>`;
            logBox.scrollTop = logBox.scrollHeight;
        }

        log("App started with Hls.js");

        const playlist = [
            {
                name: "MAX 1 (ดูสดฟุตบอลลีก)",
                url: "https://api.plus-server.sbs/play.php?key=1234&id=1776175&server=ecdn&source=bontv"
            },
            {
                name: "MAX 2 (ดูสดฟุตบอลลีก)",
                url: "https://api.plus-server.sbs/play.php?key=1234&id=1776176&server=ecdn&source=bontv"
            }
        ];

        let currentIndex = 0;
        let hls = null;

        function loadChannel(index) {
            currentIndex = index;
            const channel = playlist[currentIndex];
            
            infoBox.innerText = `ช่อง: ${channel.name} [ซ้าย/ขวา เปลี่ยนช่อง]`;
            log(`Loading: ${channel.name}`);

            if (hls) {
                hls.destroy();
                hls = null;
            }

            if (Hls.isSupported()) {
                hls = new Hls({
                    // ตั้งค่าเผื่อกรณีสตรีมต้องการ User-Agent หรือข้ามข้อจำกัดบางส่วน
                    xhrSetup: function (xhr, url) {
                        xhr.withCredentials = false; // ป้องกันปัญหา CORS ปลายทาง
                    }
                });

                hls.loadSource(channel.url);
                hls.attachMedia(video);

                hls.on(Hls.Events.MANIFEST_PARSED, function() {
                    log("Manifest parsed successfully, playing...");
                    video.play().catch(e => log("Play blocked: " + e.message));
                });

                hls.on(Hls.Events.ERROR, function(event, data) {
                    log(`HLS Error: ${data.type} - ${data.details}`);
                    if (data.fatal) {
                        switch (data.type) {
                            case Hls.ErrorTypes.NETWORK_ERROR:
                                log("Fatal network error encountered, trying to recover...");
                                hls.startLoad();
                                break;
                            case Hls.ErrorTypes.MEDIA_ERROR:
                                log("Fatal media error encountered, trying to recover...");
                                hls.recoverMediaError();
                                break;
                            default:
                                log("Unrecoverable error, stopping player.");
                                hls.destroy();
                                break;
                        }
                    }
                });
            } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                log("Using native HLS support.");
                video.src = channel.url;
                video.addEventListener('loadedmetadata', function() {
                    video.play();
                });
            } else {
                log("Error: Browser does not support HLS.");
            }
        }

        // ควบคุมผ่านรีโมท / คีย์บอร์ด
        window.addEventListener('keydown', function(e) {
            log("Key code: " + e.keyCode);
            switch(e.keyCode) {
                case 13: // Enter / OK
                    if (video.paused) { video.play(); } else { video.pause(); }
                    break;
                case 37: // LEFT arrow (ช่องก่อนหน้า)
                    loadChannel((currentIndex - 1 + playlist.length) % playlist.length);
                    break;
                case 39: // RIGHT arrow (ช่องถัดไป)
                    loadChannel((currentIndex + 1) % playlist.length);
                    break;
                case 10009: // Return / Back บน Tizen TV
                    try { tizen.application.getCurrentApplication().exit(); } catch (err) { window.history.back(); }
                    break;
            }
        });

        window.onload = function() {
            loadChannel(0);
        };
    </script>
</body>
</html>
