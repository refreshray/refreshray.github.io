<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Samsung Tizen TV IPTV Test</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0b0b0b;
            color: #ffffff;
            font-family: Arial, sans-serif;
            overflow: hidden;
            width: 1920px;
            height: 1080px;
        }

        .container {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            width: 100%;
            height: 100%;
            position: relative;
        }

        #videoPlayer {
            width: 100%;
            height: 100%;
            object-fit: contain;
            background-color: #000;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        .ui-overlay {
            position: absolute;
            bottom: 40px;
            left: 60px;
            right: 60px;
            z-index: 10;
            background: rgba(0, 0, 0, 0.8);
            padding: 20px 30px;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            border: 2px solid #444;
        }

        .channel-info {
            font-size: 24px;
            font-weight: bold;
            color: #ffcc00;
        }

        .url-box {
            font-size: 18px;
            color: #4da6ff;
            word-break: break-all;
        }

        .controls {
            display: flex;
            gap: 20px;
            font-size: 16px;
            align-items: center;
        }

        .btn {
            background: #333;
            color: white;
            padding: 6px 15px;
            border-radius: 6px;
            border: 2px solid transparent;
        }

        .btn.active {
            background: #0073e6;
            border-color: #ffffff;
        }

        #logBox {
            position: absolute;
            top: 30px;
            right: 30px;
            width: 500px;
            max-height: 250px;
            background: rgba(0, 0, 0, 0.85);
            border: 1px solid #444;
            padding: 15px;
            font-size: 14px;
            font-family: monospace;
            overflow-y: auto;
            z-index: 20;
            border-radius: 8px;
            color: #00ffcc;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Video Element สำหรับเล่นสตรีม -->
        <video id="videoPlayer" autoplay playsinline></video>

        <!-- Log Panel สำหรับดูสถานะบนจอ TV -->
        <div id="logBox">Logs:<br></div>

        <!-- UI แสดงข้อมูลช่องและลิงก์ -->
        <div class="ui-overlay" id="uiOverlay">
            <div class="channel-info" id="channelTitle">Channel: MAX 1</div>
            <div class="url-box" id="urlDisplay">Link: กำลังโหลด...</div>
            <div class="controls">
                <span class="btn active" id="statusBtn">Status: Playing</span>
                <span style="color: #aaa;">[รีโมท: ซ้าย/ขวา = เปลี่ยนช่อง, OK = เล่น/พัก, Return = ออกจากแอป]</span>
            </div>
        </div>
    </div>

    <!-- HLS.js สำหรับรองรับสตรีม HLS บนทีวี -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

    <script>
        // รายการช่องจากข้อมูลที่คุณให้มา
        const playlist = [
            {
                name: "MAX 1 (ดูสดฟุตบอลลีก)",
                url: "https://api.plus-server.sbs/play.php?key=1234&id=1776175&server=ecdn&source=bontv"[cite: 1]
            },
            {
                name: "MAX 2 (ดูสดฟุตบอลลีก)",
                url: "https://api.plus-server.sbs/play.php?key=1234&id=1776176&server=ecdn&source=bontv"[cite: 1]
            }
        ];

        let currentIndex = 0;
        let currentHls = null;

        const video = document.getElementById('videoPlayer');
        const logBox = document.getElementById('logBox');
        const urlDisplay = document.getElementById('urlDisplay');
        const channelTitle = document.getElementById('channelTitle');
        const statusBtn = document.getElementById('statusBtn');

        function log(msg) {
            console.log(msg);
            logBox.innerHTML += `> ${msg}<br>`;
            logBox.scrollTop = logBox.scrollHeight;
        }

        function loadChannel(index) {
            currentIndex = index;
            const channel = playlist[currentIndex];
            
            channelTitle.innerText = `Channel: ${channel.name}`;
            urlDisplay.innerText = `Link: ${channel.url}`;
            log(`Loading: ${channel.name}`);

            // ล้าง HLS instance เก่า (ถ้ามี)
            if (currentHls) {
                currentHls.destroy();
                currentHls = null;
            }

            if (Hls.isSupported()) {
                currentHls = new Hls();
                currentHls.loadSource(channel.url);
                currentHls.attachMedia(video);
                currentHls.on(Hls.Events.MANIFEST_PARSED, function() {
                    video.play().catch(e => log("Auto-play error: " + e.message));
                });
                currentHls.on(Hls.Events.ERROR, function(event, data) {
                    log("HLS Error: " + data.details);
                });
            } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                // สำหรับเบราว์เซอร์หรือทีวีที่รองรับ Native HLS
                video.src = channel.url;
                video.addEventListener('loadedmetadata', function() {
                    video.play().catch(e => log("Play error: " + e.message));
                });
            } else {
                log("Error: Browser/TV does not support HLS");
            }
        }

        // Video Event Listeners
        video.addEventListener('playing', () => {
            statusBtn.innerText = "Status: Playing";
        });

        video.addEventListener('pause', () => {
            statusBtn.innerText = "Status: Paused";
        });

        video.addEventListener('error', (e) => {
            if (video.error) {
                log("Video Error code: " + video.error.code);
            }
        });

        // ควบคุมผ่านรีโมทคอนโทรล Samsung Tizen TV
        window.addEventListener('keydown', function(e) {
            log("Key code: " + e.keyCode);
            
            switch(e.keyCode) {
                case 13: // Enter / OK button (Play/Pause)
                    if (video.paused) {
                        video.play();
                    } else {
                        video.pause();
                    }
                    break;
                case 37: // LEFT arrow (ช่องก่อนหน้า)
                    let prevIndex = (currentIndex - 1 + playlist.length) % playlist.length;
                    loadChannel(prevIndex);
                    break;
                case 39: // RIGHT arrow (ช่องถัดไป)
                    let nextIndex = (currentIndex + 1) % playlist.length;
                    loadChannel(nextIndex);
                    break;
                case 415: // MediaPlay
                    video.play();
                    break;
                case 19: // MediaPause
                case 413: // MediaStop
                    video.pause();
                    break;
                case 10009: // Return / Back button บนรีโมท Samsung TV
                    try {
                        tizen.application.getCurrentApplication().exit();
                    } catch (err) {
                        window.history.back();
                    }
                    break;
            }
        });

        // เริ่มต้นโหลดช่องแรกเมื่อเปิดแอป
        window.onload = function() {
            loadChannel(0);
        };
    </script>
</body>
</html>
