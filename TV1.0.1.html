<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>IPTV Web Player Test</title>
</head>
<body>
    <h3>กำลังเล่น: SAMRUJLOK</h3>
    <!-- แท็ก Video สำหรับแสดงผล -->
    <video id="videoPlayer" controls autoplay style="width: 100%; max-width: 800px;"></video>

    <!-- เรียกใช้งาน Hls.js จาก CDN -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <script>
        var video = document.getElementById('videoPlayer');
        var videoSrc = 'http://103.114.203.129:8080/ake/12345/15670'; // ใส่ลิงก์ IPTV ของคุณตรงนี้

        if (Hls.isSupported()) {
            var hls = new Hls();
            hls.loadSource(videoSrc);
            hls.attachMedia(video);
            hls.on(Hls.Events.MANIFEST_PARSED, function() {
                video.play();
            });
        } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
            // สำหรับ Safari บน iOS/Mac ที่รองรับ HLS ในตัว
            video.src = videoSrc;
            video.addEventListener('loadedmetadata', function() {
                video.play();
            });
        }
    </script>
</body>
</html>
