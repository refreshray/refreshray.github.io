<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IPTV Samsung Smart TV</title>
  
  <!-- Hls.js Library -->
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #0d0d0d;
      color: #ffffff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      overflow: hidden;
      height: 100vh;
      display: flex;
    }

    /* เมนูฝั่งซ้าย */
    #sidebar {
      width: 340px;
      background: #18181c;
      height: 100vh;
      display: flex;
      flex-direction: column;
      padding: 20px;
      box-shadow: 4px 0 15px rgba(0,0,0,0.5);
      z-index: 10;
    }

    #sidebar h2 {
      font-size: 1.3rem;
      color: #00e5ff;
      margin-bottom: 15px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    /* ช่องใส่ Custom URL */
    .custom-input-box {
      margin-bottom: 15px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .custom-input-box input {
      padding: 10px;
      border-radius: 4px;
      border: 1px solid #333;
      background: #25252b;
      color: #fff;
      font-size: 0.85rem;
    }

    .custom-input-box button {
      padding: 8px;
      background: #00e5ff;
      border: none;
      border-radius: 4px;
      color: #000;
      font-weight: bold;
      cursor: pointer;
    }

    /* รายการช่อง */
    #channel-container {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .channel-item {
      padding: 14px 16px;
      background: #25252b;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.95rem;
      border: 2px solid transparent;
      transition: all 0.2s ease;
    }

    /* สถานะเมื่อปุ่มบนรีโมทเลื่อนมาโฟกัส (สำคัญสำหรับ Smart TV) */
    .channel-item:focus,
    .channel-item.active {
      background: #00e5ff;
      color: #000000;
      font-weight: bold;
      border-color: #ffffff;
      outline: none;
      transform: scale(1.02);
    }

    /* เครื่องเล่นวิดีโอฝั่งขวา */
    #player-container {
      flex: 1;
      height: 100vh;
      background: #000000;
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    /* กล่องข้อความแจ้งเตือนสถานะ */
    #status-overlay {
      position: absolute;
      top: 30px;
      right: 30px;
      background: rgba(0, 0, 0, 0.85);
      border: 1px solid #00e5ff;
      color: #fff;
      padding: 12px 20px;
      border-radius: 8px;
      font-size: 0.9rem;
      z-index: 20;
      display: none;
    }

    /* Scrollbar Styling */
    #channel-container::-webkit-scrollbar {
      width: 6px;
    }
    #channel-container::-webkit-scrollbar-thumb {
      background: #444;
      border-radius: 3px;
    }
  </style>
</head>
<body>

  <!-- แถบเลือกช่อง -->
  <div id="sidebar">
    <h2>IPTV Player</h2>
    
    <!-- ช่องป้อน URL เองเพื่อทดสอบ -->
    <div class="custom-input-box">
      <input type="text" id="test-url" placeholder="วางลิงก์ .m3u8 หรือ .php ที่นี่" value="http://103.245.166.221/mvtv.php?id=153">
      <button id="btn-play-custom" tabindex="0">เล่นลิงก์นี้</button>
    </div>

    <div id="channel-container">
      <div class="channel-item" tabindex="0" data-url="http://103.245.166.221/mvtv.php?id=153">MVTV (ช่องทดสอบ PHP)</div>
      <div class="channel-item" tabindex="0" data-url="https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8">ช่องทดสอบ HLS 1 (Mux)</div>
      <div class="channel-item" tabindex="0" data-url="https://playertest.longtailvideo.com/adaptive/oceans/oceans.m3u8">ช่องทดสอบ HLS 2 (Oceans)</div>
    </div>
  </div>

  <!-- หน้าจอเล่นวิดีโอ -->
  <div id="player-container">
    <div id="status-overlay">กำลังเตรียมการเล่น...</div>
    <video id="video" controls autoplay playsinline></video>
  </div>

          statusOverlay.style.display = 'none';
        }, timeout);
      }
    }

      statusOverlay.style.display = 'none';
    }
