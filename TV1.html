<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IPTV Player for Samsung TV</title>
  
  <!-- Hls.js Library สำหรับเล่นไฟล์ .m3u8 -->
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #000;
      color: #fff;
      font-family: Arial, sans-serif;
      overflow: hidden; /* ป้องกัน Scrollbar บนหน้าจอ TV */
      height: 100vh;
      display: flex;
    }

    /* ซ้าย: รายการช่อง */
    #sidebar {
      width: 300px;
      background: rgba(20, 20, 20, 0.9);
      height: 100vh;
      overflow-y: auto;
      padding: 20px 10px;
      z-index: 10;
    }

    #sidebar h2 {
      font-size: 1.2rem;
      margin-bottom: 15px;
      padding-left: 10px;
      color: #00d2ff;
    }

    .channel-item {
      padding: 12px 15px;
      margin-bottom: 8px;
      background: #222;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s;
    }

    /* Style สำหรับปุ่มที่ถูก Focus (สำคัญมากสำหรับรีโมท TV) */
    .channel-item:focus,
    .channel-item.active {
      background: #00d2ff;
      color: #000;
      font-weight: bold;
      outline: none;
      transform: scale(1.02);
    }

    /* ขวา: พื้นที่เล่นวิดีโอ */
    #player-container {
      flex: 1;
      height: 100vh;
      background: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    /* ข้อความแจ้งเตือนสถานะ */
    #status {
      position: absolute;
      top: 20px;
      right: 20px;
      background: rgba(0,0,0,0.7);
      padding: 8px 15px;
      border-radius: 4px;
      font-size: 0.9rem;
      display: none;
    }
  </style>
</head>
<body>

  <!-- แถบเลือกช่องรายการ -->
  <div id="sidebar">
    <h2>IPTV Channels</h2>
    <div id="channel-list">
      <!-- เพิ่ม URL รายการช่อง (.m3u8) ของคุณตรงนี้ -->
      <div class="channel-item" tabindex="0" data-url="https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8">ช่องทดสอบ 1 (Big Buck Bunny)</div>
      <div class="channel-item" tabindex="0" data-url="https://playertest.longtailvideo.com/adaptive/oceans/oceans.m3u8">ช่องทดสอบ 2 (Oceans)</div>
      <div class="channel-item" tabindex="0" data-url="http://103.245.166.221/mvtv.php?id=153">Boomerang</div>
    </div>
  </div>

  <!-- เครื่องเล่นวิดีโอ -->
  <div id="player-container">
    <div id="status">กำลังโหลด...</div>
    <video id="video" controls autoplay></video>
  </div>

  <script>
    const video = document.getElementById('video');
    const channelItems = document.querySelectorAll('.channel-item');
    const statusDiv = document.getElementById('status');
    let hls = null;

    // ฟังก์ชันสำหรับเล่น Stream
    function playStream(url) {
      statusDiv.style.display = 'block';
      statusDiv.innerText = 'กำลังโหลดช่อง...';

      if (Hls.isSupported()) {
        if (hls) {
          hls.destroy(); // ล้าง Instance เก่าก่อนเปลี่ยนช่อง
        }
        hls = new Hls();
        hls.loadSource(url);
        hls.attachMedia(video);
        hls.on(Hls.Events.MANIFEST_PARSED, function () {
          video.play().catch(e => console.log("Autoplay blocked:", e));
          statusDiv.style.display = 'none';
        });
        hls.on(Hls.Events.ERROR, function (event, data) {
          if (data.fatal) {
            statusDiv.innerText = 'ไม่สามารถเล่นช่องนี้ได้';
          }
        });
      } 
      // สำหรับ Browser ที่รองรับ HLS โดยตรง (เช่น Safari หรือ Smart TV บางรุ่น)
      else if (video.canPlayType('application/vnd.apple.mpegurl')) {
        video.src = url;
        video.addEventListener('loadedmetadata', function () {
          video.play();
          statusDiv.style.display = 'none';
        });
      } else {
        statusDiv.innerText = 'เบราว์เซอร์ไม่รองรับการเล่น HLS';
      }
    }

    // กำหนด Event ให้กับปุ่มเลือกช่อง
    channelItems.forEach(item => {
      // เมื่อกดด้วยเม้าส์/คลิก
      item.addEventListener('click', function () {
        setActiveChannel(this);
      });

      // เมื่อกดปุ่ม Enter จากรีโมท TV
      item.addEventListener('keydown', function (e) {
        if (e.key === 'Enter' || e.keyCode === 13) {
          setActiveChannel(this);
        }
      });
    });

    function setActiveChannel(element) {
      channelItems.forEach(i => i.classList.remove('active'));
      element.classList.add('active');
      const streamUrl = element.getAttribute('data-url');
      playStream(streamUrl);
    }

    // โฟกัสช่องแรกอัตโนมัติเมื่อเปิดหน้าเว็บ
    if (channelItems.length > 0) {
      channelItems[0].focus();
    }

    // ดักจับ Key Code ของรีโมท Samsung Smart TV (Tizen)
    window.addEventListener('keydown', function (e) {
      switch (e.keyCode) {
        case 37: // Left Arrow
          document.getElementById('sidebar').focus();
          break;
        case 39: // Right Arrow
          video.focus();
          break;
        case 10073: // Channel Down (ปุ่มเปลี่ยนช่องลงบนรีโมท Samsung)
        case 10072: // Channel Up (ปุ่มเปลี่ยนช่องขึ้นบนรีโมท Samsung)
          // สามารถเพิ่ม logic สลับช่องได้ตามต้องการ
          break;
      }
    });
  </script>
</body>
</html>
