<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- อนุญาตและแปลงการร้องขอ HTTP ให้ผ่านการตรวจสอบด้านความปลอดภัยเบื้องต้น -->
    <meta http-equiv="Content-Security-Policy" content="upgrade-insecure-requests">
    <title>ช่องทางธรรมชาติ</title>
    <!-- HLS.js Library -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body, html {
            width: 100%;
            height: 100%;
            background-color: #000;
            color: #fff;
            font-family: Arial, sans-serif;
            overflow: hidden;
        }

        /* 📺 เครื่องเล่นวิดีโอ (บังคับเต็มจอ 100%) */
        .player-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            overflow: hidden;
            background: #000;
        }
        #video-player {
            width: 100% !important;
            height: 100% !important;
            object-fit: contain;
        }

        /* 🖱️ พื้นที่ดักจับเมาส์ขอบซ้ายจอ (Invisible Trigger Zone) */
        .sidebar-trigger {
            position: absolute;
            top: 0;
            left: 0;
            width: 40px;
            height: 100%;
            z-index: 999;
        }

        /* 🗂️ เมนูด้านซ้าย (Sidebar) */
        #sidebar {
            position: absolute;
            top: 0;
            left: -340px;
            width: 320px;
            height: 100%;
            background: rgba(15, 15, 15, 0.95);
            box-shadow: 5px 0 15px rgba(0,0,0,0.7);
            transition: left 0.3s cubic-bezier(0.25, 1, 0.5, 1);
            z-index: 1000;
            padding: 20px;
            display: flex;
            flex-direction: column;
        }

        .sidebar-trigger:hover + #sidebar,
        #sidebar:hover {
            left: 0;
        }

        #sidebar h2 {
            color: orange;
            text-align: center;
            font-size: 20px;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px solid #333;
        }

        /* 📜 รายการกล่องช่องทีวี */
        #channel-list {
            flex-grow: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
            padding-right: 5px;
        }

        #channel-list::-webkit-scrollbar {
            width: 6px;
        }
        #channel-list::-webkit-scrollbar-thumb {
            background: #444;
            border-radius: 3px;
        }

        /* 🔳 ปุ่มช่องทีวี */
        .channel {
            cursor: pointer;
            padding: 10px;
            background: #222;
            border: 1px solid #444;
            border-radius: 8px;
            text-align: center;
            width: 100%;
            min-height: 70px;
            display: flex;
            justify-content: flex-start;
            align-items: center;
            transition: all 0.2s;
            overflow: hidden;
            gap: 12px;
        }
        .channel img {
            width: 50px;
            height: 40px;
            object-fit: contain;
            display: block;
            background: #111;
            border-radius: 4px;
        }
        .channel-name {
            font-size: 15px;
            text-align: left;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .channel:hover, .channel:focus {
            background: orange;
            color: black;
            border-color: #fff;
            transform: scale(1.02);
            outline: none;
        }

        .channel.active {
            background: orange;
            color: black;
            border-color: #fff;
            font-weight: bold;
        }

        /* หน้าจอแจ้งเตือน Error */
        #error-msg {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #ff4d4d;
            background: rgba(0,0,0,0.8);
            padding: 15px 25px;
            border-radius: 8px;
            display: none;
            z-index: 10;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="sidebar-trigger"></div>

    <nav id="sidebar">
        <h2>ช่องทางธรรมชาติ</h2>
        <div id="channel-list"></div>
    </nav>

    <div class="player-container">
        <div id="error-msg"></div>
        <video id="video-player" controls autoplay playsinline></video>
    </div>

    <script>
        // รวมรายการช่องของคุณ
        const channels = [
            {
                name: "Boomerang TH ",
                logo: "https://via.placeholder.com/50x40?text=MVTV",
                url: "http://103.245.166.221/mvtv.php?id=153"
            },
			{
                name: "CARTOON NETWORK ",
                logo: "",
                file: "https://udn-streamer1.cdn.3bbtv.com:8443/3bb/live/301/301.mpd",
                keyId: "f140b94c73ab4ef5b96da7f49afb1154",
                key: "85e4ef232c6e460f888eb20f651d66e3",
				drm: true
            },
			{
    			name: "ช่องติด DRM ClearKey",
    			type: "dash",
    			url: "proxy.php?url=" + encodeURIComponent("https://udn-streamer1.cdn.3bbtv.com:8443/3bb/live/301/301.mpd"),
    			drmKeyId: "f140b94c73ab4ef5b96da7f49afb1154", // Key ID
    			drmKey: "85e4ef232c6e460f888eb20f651d66e3"     // Key ค่าถอดรหัส
			},
            {
                name: "Monomax 1",
                logo: "https://via.placeholder.com/50x40?text=Mono",
                type: "hls",
                url: "https://api.plus-server.sbs/play.php?key=1234&id=1776175&server=_ecdn&source=bontv"
            },            
            {
                name: "Monomax 2",
                logo: "https://via.placeholder.com/50x40?text=Mono",
                url: "https://api.plus-server.sbs/play.php?key=1234&id=1776176&server=_ecdn&source=bontv"
            }            
        ];

        let hlsPlayer = null;

        function showError(text) {
            const errDiv = document.getElementById('error-msg');
            errDiv.innerText = text;
            errDiv.style.display = 'block';
        }

        function hideError() {
            document.getElementById('error-msg').style.display = 'none';
        }

        function loadChannel(index) {
            hideError();
            const channel = channels[index];
            const video = document.getElementById('video-player');
            
            // อัปเดตการเลือกปุ่ม
            document.querySelectorAll('.channel').forEach((btn, idx) => {
                btn.classList.toggle('active', idx === index);
            });

            // ทำลาย HLS Instance เดิม
            if (hlsPlayer) {
                hlsPlayer.destroy();
                hlsPlayer = null;
            }

            if (Hls.isSupported()) {
                // ตั้งค่าการดึง Stream ข้าม Server/Redirect
                hlsPlayer = new Hls({
                    enableWorker: true,
                    lowLatencyMode: true,
                    xhrSetup: function(xhr, url) {
                        xhr.withCredentials = false;
                    }
                });

                hlsPlayer.loadSource(channel.url);
                hlsPlayer.attachMedia(video);

                hlsPlayer.on(Hls.Events.MANIFEST_PARSED, function() {
                    video.play().catch(e => console.log("Autoplay blocked:", e));
                });

                // ตรวจจับหากติด CORS หรือ Server ปิดกั้น
                hlsPlayer.on(Hls.Events.ERROR, function(event, data) {
                    if (data.fatal) {
                        console.error("HLS Fatal Error:", data);
                        if (data.type === Hls.ErrorTypes.NETWORK_ERROR) {
                            showError("ไม่สามารถดึงสัญญาณได้ (ติด CORS หรือ Server บล็อก)");
                        } else {
                            showError("เกิดข้อผิดพลาดในการเล่นวิดีโอ");
                        }
                    }
                });

            } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                // สำหรับ Safari / iOS Native
                video.src = channel.url;
                video.addEventListener('loadedmetadata', function() {
                    video.play().catch(() => {});
                });
            } else {
                showError("เบราว์เซอร์ของคุณไม่รองรับการเล่น HLS Stream");
            }
        }

        function initSidebar() {
            const listContainer = document.getElementById('channel-list');
            listContainer.innerHTML = '';

            channels.forEach((channel, index) => {
                const btn = document.createElement('div');
                btn.className = 'channel';
                btn.onclick = () => loadChannel(index);

                btn.innerHTML = `
                    <img src="${channel.logo}" alt="${channel.name}">
                    <span class="channel-name">${channel.name}</span>
                `;
                listContainer.appendChild(btn);
            });

            if (channels.length > 0) {
                loadChannel(0);
            }
        }

        document.addEventListener('DOMContentLoaded', initSidebar);
    </script>
</body>
</html>
