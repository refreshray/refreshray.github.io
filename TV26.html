<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ช่องทางธรรมชาติ</title>
    <script src="https://ssl.p.jwpcdn.com/player/v/8.26.0/jwplayer.js"></script>
    <script>
        jwplayer.key = 'XSuP4qMl+9tK17QNb+4+th2Pm9AWgMO/cYH8CI0HGGr7bdjo';
    </script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body, html {
            width: 100%;
            height: 100%;
            background-color: #000;
            color: #fff;
            font-family: Arial, sans-serif;
            overflow: hidden;
        }

        /* 📺 ส่วนของเครื่องเล่นวิดีโอ (บังคับเต็มจอ 100%) */
        .player-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }
        #player {
            width: 100% !important;
            height: 100% !important;
        }

        /* 🖱️ พื้นที่ดักจับเมาส์ขอบซ้ายจอ (Invisible Trigger Zone) */
        .sidebar-trigger {
            position: absolute;
            top: 0;
            left: 0;
            width: 40px;
            height: 100%;
            z-index: 999;
        }

        /* 🗂️ เมนูด้านซ้าย (Sidebar) */
        #sidebar {
            position: absolute;
            top: 0;
            left: -340px; /* ซ่อนไว้ด้านซ้าย */
            width: 320px;
            height: 100%;
            background: rgba(15, 15, 15, 0.95);
            box-shadow: 5px 0 15px rgba(0,0,0,0.7);
            transition: left 0.3s cubic-bezier(0.25, 1, 0.5, 1);
            z-index: 1000;
            padding: 20px;
            display: flex;
            flex-direction: column;
        }

        /* กลไกเมื่อเมาส์ Hover ที่พื้นที่ดักจับ หรือที่ตัว Sidebar ให้สไลด์เมนูออกมา */
        .sidebar-trigger:hover + #sidebar,
        #sidebar:hover {
            left: 0;
        }

        #sidebar h2 {
            color: orange;
            text-align: center;
            font-size: 20px;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px solid #333;
        }

        /* ช่องสำหรับวางลิงก์ M3U ภายนอกเสริม (ถ้าต้องการ) */
        .sidebar-input {
            margin-bottom: 15px;
        }
        .sidebar-input input {
            width: 100%;
            padding: 8px;
            background: #222;
            border: 1px solid #444;
            color: #fff;
            border-radius: 4px;
            font-size: 13px;
        }

        /* 📜 รายการกล่องช่องทีวี (เปลี่ยนเป็นแนวตั้ง) */
        #channel-list {
            flex-grow: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
            padding-right: 5px;
        }

        /* ปรับแต่งความสวยงามของ Scrollbar บนเมนู */
        #channel-list::-webkit-scrollbar {
            width: 6px;
        }
        #channel-list::-webkit-scrollbar-thumb {
            background: #444;
            border-radius: 3px;
        }

        /* 🔳 ปุ่มช่องทีวีแต่ละช่อง */
        .channel {
            cursor: pointer;
            padding: 10px;
            background: #222;
            border: 1px solid #444;
            border-radius: 8px;
            text-align: center;
            width: 100%;
            min-height: 70px;
            display: flex;
            justify-content: flex-start;
            align-items: center;
            transition: all 0.2s;
            overflow: hidden;
            gap: 12px;
        }
        .channel img {
            width: 50px;
            height: 40px;
            object-fit: contain;
            display: block;
            background: #111;
            border-radius: 4px;
        }
        .channel-name {
            font-size: 15px;
            text-align: left;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .channel:hover, .channel:focus {
            background: #333;
            border-color: #666;
            transform: scale(1.02);
            outline: none;
        }

        /* ✨ ไฮไลท์ช่องที่กำลังเล่นอยู่ */
        .channel.active {
            background: #2a1f00;
            border-color: orange;
            box-shadow: 0 0 10px rgba(255, 165, 0, 0.4);
        }
        .channel.active .channel-name {
            color: orange;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <!-- พื้นที่ดักจับเมาส์ขอบซ้ายจอ -->
    <div class="sidebar-trigger"></div>

    <!-- เมนูด้านซ้าย (ซ่อนอยู่) -->
    <nav id="sidebar">
        <h2>ช่องทางธรรมชาติ</h2>
        <div class="sidebar-input">
            <input type="text" id="m3u-url-input" placeholder="วางลิงก์ .m3u ภายนอก (แล้วกด Enter)" />
        </div>
        <div id="channel-list"></div>
    </nav>

    <!-- เครื่องเล่นวิดีโอเต็มจอ -->
    <div class="player-container">
        <div id="player"></div>
    </div>

    <!-- 🟢 วางข้อมูล M3U ฝังไว้ตรงนี้โดยตรง (สามารถแก้ไขหรือเพิ่มลิสต์ช่องได้ที่นี่) -->
    <script id="embedded-m3u" type="text/plain">
#EXTM3U 

        
    </script>

    <script>
        let channels = [];
        let activeChannelDiv = null;

        // ฟังก์ชันแปลงข้อความ M3U เป็นอาเรย์ของช่อง
        function parseM3U(m3uText) {
            const lines = m3uText.split('\n');
            const parsedChannels = [];
            let currentChannel = {};

            for (let line of lines) {
                line = line.trim();
                if (line.startsWith('#EXTINF:')) {
                    currentChannel = {};
                    
                    // ดึงชื่อช่อง
                    const nameMatch = line.match(/,(.+)$/);
                    if (nameMatch) {
                        currentChannel.name = nameMatch[1].trim();
                    }

                    // ดึง Logo (ถ้ามี)
                    const logoMatch = line.match(/tvg-logo="([^"]*)"/);
                    if (logoMatch && logoMatch[1]) {
                        currentChannel.logo = logoMatch[1];
                    } else {
                        currentChannel.logo = "";
                    }
                } else if (line && !line.startsWith('#')) {
                    currentChannel.file = line;
                    
                    // เช็คประเภทไฟล์ว่าเป็น .mpd (DRM) หรือ .m3u8 (HLS)
                    if (line.endsWith('.mpd') || line.includes('.mpd')) {
                        currentChannel.drm = true;
                        currentChannel.keyId = "x"; // สามารถแก้ไข KeyId ที่นี่หรือปรับเพิ่มใน M3U
                        currentChannel.key = "x";     // สามารถแก้ไข Key ที่นี่
                    } else {
                        currentChannel.drm = false;
                    }
                    parsedChannels.push(currentChannel);
                }
            }
            return parsedChannels;
        }

        // ฟังก์ชันโหลด Player และจัดการไฮไลท์ช่อง
        function loadPlayer(channel, element) {
            const config = {
                file: channel.file,
                width: "100%",
                height: "100%",
                autostart: true,
                mute: false
            };

            if (channel.drm) {
                config.type = "dash";
                config.drm = {
                    clearkey: {
                        keyId: channel.keyId,
                        key: channel.key
                    }
                };
            } else {
                config.type = "hls";
            }

            jwplayer("player").setup(config);

            // จัดการเปลี่ยนสถานะ Highlight
            if (activeChannelDiv) {
                activeChannelDiv.classList.remove("active");
            }
            if (element) {
                element.classList.add("active");
                activeChannelDiv = element;
            }
        }

        // ฟังก์ชันสร้างรายการช่องลงในหน้าเว็บ
        function renderChannelList(channelArray) {
            const channelList = document.getElementById("channel-list");
            channelList.innerHTML = "";
            channels = channelArray;

            channels.forEach((channel, idx) => {
                const div = document.createElement("div");
                div.className = "channel";
                div.tabIndex = idx + 1;
                
                const logoHtml = channel.logo  
                    ? `<img src="${channel.logo}" alt="${channel.name}">`
                    : `<div style="width:50px; height:40px; background:#333; border-radius:4px; display:flex; justify-content:center; align-items:center; font-size:10px; color:#aaa;">No Pix</div>`;
                
                div.innerHTML = logoHtml + `<span class="channel-name">${channel.name}</span>`;
                
                div.onclick = () => loadPlayer(channel, div);
                div.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter') loadPlayer(channel, div);
                });
                
                channelList.appendChild(div);
            });

            // เล่นช่องแรกทันทีเมื่อโหลดเสร็จ (ถ้ามีข้อมูล)
            if (channels.length > 0) {
                loadPlayer(channels[0], channelList.firstChild);
            }
        }

        // โหลดข้อมูล M3U ที่ฝังไว้ตั้งแต่เริ่มเปิดหน้าเว็บ
        const embeddedM3UText = document.getElementById("embedded-m3u").textContent;
        const initialChannels = parseM3U(embeddedM3UText);
        renderChannelList(initialChannels);

        // รองรับการดึง M3U จากลิงก์ภายนอกผ่านช่องกรอก (ถ้าต้องการเปลี่ยนหรือเพิ่ม)
        document.getElementById("m3u-url-input").addEventListener("keypress", async function(e) {
            if (e.key === 'Enter') {
                const url = this.value.trim();
                if (!url) return;
                try {
                    const response = await fetch(url);
                    const text = await response.text();
                    const newChannels = parseM3U(text);
                    if (newChannels.length > 0) {
                        renderChannelList(newChannels);
                        alert("โหลดรายการช่องจากลิงก์สำเร็จ!");
                    } else {
                        alert("ไม่พบข้อมูลช่องในลิงก์นี้");
                    }
                } catch (err) {
                    alert("ไม่สามารถดึงข้อมูลจากลิงก์ได้ (อาจติดปัญหา CORS Policy)");
                    console.error(err);
                }
            }
        });
    </script>
</body>
</html>
