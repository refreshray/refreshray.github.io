<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ช่องทางธรรมชาติ</title>
    <script src="https://ssl.p.jwpcdn.com/player/v/8.26.0/jwplayer.js"></script>
    <script>
        jwplayer.key = 'XSuP4qMl+9tK17QNb+4+th2Pm9AWgMO/cYH8CI0HGGr7bdjo';
    </script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body, html {
            width: 100%;
            height: 100%;
            background-color: #000;
            color: #fff;
            font-family: Arial, sans-serif;
            overflow: hidden;
        }

        /* 📺 ส่วนของเครื่องเล่นวิดีโอ (บังคับเต็มจอ 100%) */
        .player-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }
        #player {
            width: 100% !important;
            height: 100% !important;
        }

        /* 🖱️ พื้นที่ดักจับเมาส์ขอบซ้ายจอ (Invisible Trigger Zone) */
        .sidebar-trigger {
            position: absolute;
            top: 0;
            left: 0;
            width: 40px;
            height: 100%;
            z-index: 999;
        }

        /* 🗂️ เมนูด้านซ้าย (Sidebar) */
        #sidebar {
            position: absolute;
            top: 0;
            left: -340px; /* ซ่อนไว้ด้านซ้าย */
            width: 320px;
            height: 100%;
            background: rgba(15, 15, 15, 0.95);
            box-shadow: 5px 0 15px rgba(0,0,0,0.7);
            transition: left 0.3s cubic-bezier(0.25, 1, 0.5, 1);
            z-index: 1000;
            padding: 20px;
            display: flex;
            flex-direction: column;
        }

        /* กลไกเมื่อเมาส์ Hover ที่พื้นที่ดักจับ หรือที่ตัว Sidebar ให้สไลด์เมนูออกมา */
        .sidebar-trigger:hover + #sidebar,
        #sidebar:hover {
            left: 0;
        }

        #sidebar h2 {
            color: orange;
            text-align: center;
            font-size: 20px;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px solid #333;
        }

        /* 📜 รายการกล่องช่องทีวี (แนวตั้ง) */
        #channel-list {
            flex-grow: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
            padding-right: 5px;
        }

        /* ปรับแต่งความสวยงามของ Scrollbar บนเมนู */
        #channel-list::-webkit-scrollbar {
            width: 6px;
        }
        #channel-list::-webkit-scrollbar-thumb {
            background: #444;
            border-radius: 3px;
        }

        /* 🔳 ปุ่มช่องทีวีแต่ละช่อง */
        .channel {
            cursor: pointer;
            padding: 10px;
            background: #222;
            border: 1px solid #444;
            border-radius: 8px;
            text-align: center;
            width: 100%;
            min-height: 70px;
            display: flex;
            justify-content: flex-start;
            align-items: center;
            transition: all 0.2s;
            overflow: hidden;
            gap: 12px;
        }
        .channel img {
            width: 50px;
            height: 40px;
            object-fit: contain;
            display: block;
            background: #111;
            border-radius: 4px;
        }
        .channel-name {
            font-size: 15px;
            text-align: left;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .channel:hover, .channel:focus {
            background: orange;
            color: black;
            border-color: #fff;
            transform: scale(1.02);
            outline: none;
        }

        /* 🌟 สถานะช่องที่กำลังเล่นอยู่ (Active State) */
        .channel.active {
            background: orange;
            color: black;
            border-color: #fff;
            font-weight: bold;
        }

    </style>
</head>
<body>

    <!-- พื้นที่ดักจับเมาส์ขอบซ้ายจอ -->
    <div class="sidebar-trigger"></div>

    <!-- เมนูด้านซ้าย (ซ่อนอยู่) -->
    <nav id="sidebar">
        <h2>ช่องทางธรรมชาติ</h2>
        <div id="channel-list"></div>
    </nav>

    <!-- เครื่องเล่นวิดีโอ/คอนเทนต์เต็มจอ -->
    <div class="player-container">
        <div id="player"></div>
    </div>

    <script>
        // รายการช่อง
        const channels = [
            {
                name: "CARTOON NETWORK ",
                logo: "",
                file: "https://udn-streamer1.cdn.3bbtv.com:8443/3bb/live/301/301.mpd",
                keyId: "f140b94c73ab4ef5b96da7f49afb1154",
                key: "85e4ef232c6e460f888eb20f651d66e3",
                drm: true
            },
            {
                name: "Cartoonito",
                logo: "",
                file: "https://udn-streamer1.cdn.3bbtv.com:8443/3bb/live/302/302.mpd",
                keyId: "ad2371259d34404cb89d54a4dc88dcd3",
                key: "1ba155e345c4456ba891cbee9b3e1c4c",
                drm: true
            },
            {
                name: "Nickelodeo",
                logo: "",
                file: "https://udn-streamer1.cdn.3bbtv.com:8443/3bb/live/303/303.mpd",
                keyId: "9130a6448a74430794d355b48b56a64c",
                key: "c2f4d3288cdb43cf81e519ceb414dd6f",
                drm: true
            },
            {
                name: "Nickjr",
                logo: "",
                file: "https://udn-streamer1.cdn.3bbtv.com:8443/3bb/live/304/304.mpd",
                keyId: "641c3f0e676d49d18c2082e093380e69",
                key: "e06f3a2e327643249c3831ab199c4015",
                drm: true
            },		
            {
                name: "Food_Network",
                logo: "",
                file: "https://cri-streamer3.cdn.3bbtv.com:8443/3bb/live/205/205.mpd",
                keyId: "d4b9d55410d24905920e57664a047116",
                key: "d821110f280f4545ae0227d5784af199",
                drm: true
            },
            {
                name: "Trace Urban",
                logo: "",
                file: "https://jmp2.uk/stvp-ESBA3300043M0",
                isIframe: true // 👈 เปิดใช้งานระบบ Iframe สำหรับลิงก์นี้
            }
        ];

        function loadPlayer(channel, element) {
            const container = document.querySelector('.player-container');

if (channel.isIframe) {
    if (window.jwplayer && jwplayer("player").getState) {
        jwplayer("player").remove();
    }
    // ใช้ CSS scale(1.5) เพื่อขยายวิดีโอข้างใน iframe ให้เต็มจอขึ้น (ปรับเลข 1.5 เพิ่ม/ลด ได้ตามต้องการ)
    container.innerHTML = `
        <div style="width:100%; height:100%; overflow:hidden; display:flex; justify-content:center; align-items:center;">
            <iframe src="${channel.file}" 
                    style="width:100%; height:100%; border:none; transform: scale(1.4); transform-origin: center center;" 
                    allow="autoplay; encrypted-media" 
                    allowfullscreen>
            </iframe>
        </div>`;
}

                const config = {
                    file: channel.file,
                    width: "100%",
                    height: "100%",
                    autostart: true,
                    mute: false
                };

                if (channel.drm) {
                    config.type = "dash";
                    config.drm = {
                        clearkey: {
                            keyId: channel.keyId,
                            key: channel.key
                        }
                    };
                } else {
                    config.type = "hls";
                }

                jwplayer("player").setup(config);
            }

            // จัดการไฮไลต์สีส้มค้างไว้ที่ช่องที่กำลังเล่น
            if (element) {
                document.querySelectorAll('.channel').forEach(el => el.classList.remove('active'));
                element.classList.add('active');
            }
        }

        // สร้างรายการปุ่มช่องทีวี
        const channelList = document.getElementById("channel-list");
        channels.forEach((channel, idx) => {
            const div = document.createElement("div");
            div.className = "channel";
            div.tabIndex = idx + 1;
            
            const logoHtml = channel.logo 
                ? `<img src="${channel.logo}" alt="${channel.name}">`
                : `<div style="width:50px; height:40px; background:#333; border-radius:4px; display:flex; justify-content:center; align-items:center; font-size:10px; color:#aaa;">No Pix</div>`;
            
            div.innerHTML = logoHtml + `<span class="channel-name">${channel.name}</span>`;
            
            div.onclick = () => loadPlayer(channel, div);
            div.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') loadPlayer(channel, div);
            });
            
            channelList.appendChild(div);
        });

        // เปิดเล่นช่องแรกทันทีเมื่อโหลดหน้าเว็บ
        if (channels.length > 0) {
            const firstChannelEl = channelList.querySelector('.channel');
            loadPlayer(channels[0], firstChannelEl);
        }
    </script>
</body>
</html>
