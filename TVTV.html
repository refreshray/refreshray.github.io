        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body, html {
            width: 100%;
            height: 100%;
            background-color: #000;
            color: #fff;
            font-family: Arial, sans-serif;
            overflow: hidden;
        }

        /* 📺 เครื่องเล่นวิดีโอ */
        .player-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }
        #player {
            width: 100% !important;
            height: 100% !important;
        }

        /* 🖱️ พื้นที่ดักจับเมาส์ขอบซ้าย */
        .sidebar-trigger {
            position: absolute;
            top: 0;
            left: 0;
            width: 40px;
            height: 100%;
            z-index: 999;
        }

        /* 🗂️ เมนูด้านซ้าย (Sidebar) */
        #sidebar {
            position: absolute;
            top: 0;
            left: -340px;
            width: 320px;
            height: 100%;
            background: rgba(15, 15, 15, 0.95);
            box-shadow: 5px 0 15px rgba(0,0,0,0.7);
            transition: left 0.3s cubic-bezier(0.25, 1, 0.5, 1);
            z-index: 1000;
            padding: 20px;
            display: flex;
            flex-direction: column;
        }

        .sidebar-trigger:hover + #sidebar,
        #sidebar:hover {
            left: 0;
        }

        #sidebar h2 {
            color: orange;
            text-align: center;
            font-size: 20px;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px solid #333;
        }

        /* 📜 เมนู Tree View Container */
        #tree-menu {
            flex-grow: 1;
            overflow-y: auto;
            padding-right: 5px;
        }

        #tree-menu::-webkit-scrollbar {
            width: 6px;
        }
        #tree-menu::-webkit-scrollbar-thumb {
            background: #444;
            border-radius: 3px;
        }

        /* ปุ่ม "ทั้งหมด" ด้านบนสุด */
        .all-channels-btn {
            font-size: 18px;
            font-weight: bold;
            color: #fff;
            padding: 8px 12px;
            cursor: pointer;
            border-radius: 6px;
            margin-bottom: 8px;
            transition: background 0.2s;
        }
        .all-channels-btn:hover {
            background: #222;
            color: orange;
        }

        /* หัวข้อหมวดหมู่ (Category Header) */
        .category-item {
            font-size: 16px;
            font-weight: bold;
            color: #fff;
            padding: 10px 12px;
            cursor: pointer;
            border-radius: 6px;
            margin-top: 4px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            user-select: none;
            transition: all 0.2s;
        }
        .category-item:hover {
            background: #222;
            color: orange;
        }
        .category-item::after {
            content: '▶';
            font-size: 10px;
            color: orange;
            transition: transform 0.2s;
        }
        .category-item.open::after {
            transform: rotate(90deg);
        }

        /* Container สำหรับรายการช่องย่อย ( Tree Sub-menu ) */
        .channel-sub-group {
            display: none; /* ซ่อนไว้ก่อน */
            position: relative;
            margin-left: 25px;
            padding-left: 15px;
        }

        /* เส้นแกนหลักแนวยาวสีส้ม */
        .channel-sub-group::before {
            content: '';
            position: absolute;
            top: 0;
            bottom: 20px;
            left: 0;
            width: 2px;
            background: orange;
        }

        .category-item.open + .channel-sub-group {
            display: block; /* แสดงผลเมื่อคลิกเปิด */
        }

        /* รายการช่องย่อยแต่ละช่อง */
        .channel-node {
            position: relative;
            display: flex;
            align-items: center;
            padding: 8px 10px;
            margin: 4px 0;
            cursor: pointer;
            border-radius: 6px;
            transition: background 0.2s;
        }

        /* เส้นกิ่งแขนงสีส้มแนวนอนที่เชื่อมกับแกนหลัก */
        .channel-node::before {
            content: '';
            position: absolute;
            top: 50%;
            left: -15px;
            width: 15px;
            height: 2px;
            background: orange;
        }

        .channel-node:hover {
            background: #333;
        }

        .channel-node-name {
            font-size: 14px;
            color: #ddd;
        }

        .channel-node:hover .channel-node-name {
            color: orange;
            font-weight: bold;
        }
    </style>

        function loadPlayer(channel) {
            const config = {
                file: channel.file,
                width: "100%",
                height: "100%",
                autostart: true,
                mute: false
            };

            if (channel.drm) {
                config.type = "dash";
                config.drm = {
                    clearkey: {
                        keyId: channel.keyId,
                        key: channel.key
                    }
                };
            } else {
                config.type = "hls";
            }

            jwplayer("player").setup(config);
        }

        // --- สร้าง Tree View Menu ---
        const treeMenu = document.getElementById("tree-menu");

        // 1. จัดกลุ่มช่องตาม Category
        const groupedChannels = channels.reduce((acc, channel) => {
            const cat = channel.category || "ช่องทั่วไป";
            if (!acc[cat]) acc[cat] = [];
            acc[cat].push(channel);
            return acc;
        }, {});

        // 2. สร้างปุ่ม "ทั้งหมด"
        const allBtn = document.createElement("div");
        allBtn.className = "all-channels-btn";
        allBtn.textContent = "ทั้งหมด";
        // ✅ โค้ดใหม่: กด "ทั้งหมด" แล้วเปิดกางทุกหมวดหมู่ออกมาทันที
        allBtn.onclick = () => {
    document.querySelectorAll(".category-item").forEach(el => el.classList.add("open"));
};
        treeMenu.appendChild(allBtn);

        // 3. วนลูปสร้างหมวดหมู่และโหนดช่องย่อย
        let isFirstCategory = true;
        for (const category in groupedChannels) {
            // หัวข้อหมวดหมู่
            const catDiv = document.createElement("div");
            catDiv.className = "category-item";
            catDiv.textContent = category;

            // คอนเทนเนอร์เก็บช่องย่อย
            const subGroup = document.createElement("div");
            subGroup.className = "channel-sub-group";

            // สลับการ เปิด/ปิด ( Accordion Effect )
            catDiv.onclick = () => {
                const isOpen = catDiv.classList.contains("open");
                // ซ่อนหมวดหมู่อื่นไว้ก่อน
                document.querySelectorAll(".category-item").forEach(el => el.classList.remove("open"));
                if (!isOpen) {
                    catDiv.classList.add("open");
                }
            };

            // สร้างกิ่งย่อยแต่ละช่อง
            groupedChannels[category].forEach(channel => {
                const node = document.createElement("div");
                node.className = "channel-node";
                node.innerHTML = `<span class="channel-node-name">${channel.name}</span>`;
                node.onclick = (e) => {
                    e.stopPropagation(); // กันไม่ให้ไปกระทบการคลิกหมวดหมู่
                    loadPlayer(channel);
                };
                subGroup.appendChild(node);
            });

            treeMenu.appendChild(catDiv);
            treeMenu.appendChild(subGroup);

            // เปิดกางหมวดหมู่แรกไว้เป็น Default
            if (isFirstCategory) {
                catDiv.classList.add("open");
                isFirstCategory = false;
            }
        }

        // เล่นช่องแรกทันทีเมื่อเปิดเว็บ
        if (channels.length > 0) {
            loadPlayer(channels[0]);
        }
