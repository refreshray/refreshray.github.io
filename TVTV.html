        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body, html {
            width: 100%;
            height: 100%;
            background-color: #000;
            color: #fff;
            font-family: Arial, sans-serif;
            overflow: hidden;
        }

        /* 📺 ส่วนของเครื่องเล่นวิดีโอ (บังคับเต็มจอ 100%) */
        .player-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }
        #player {
            width: 100% !important;
            height: 100% !important;
        }

        /* 🖱️ พื้นที่ดักจับเมาส์ขอบซ้ายจอ (Invisible Trigger Zone) */
        .sidebar-trigger {
            position: absolute;
            top: 0;
            left: 0;
            width: 40px;
            height: 100%;
            z-index: 999;
        }

        /* 🗂️ เมนูด้านซ้าย (Sidebar) */
        #sidebar {
            position: absolute;
            top: 0;
            left: -340px; /* ซ่อนไว้ด้านซ้าย */
            width: 320px;
            height: 100%;
            background: rgba(15, 15, 15, 0.95);
            box-shadow: 5px 0 15px rgba(0,0,0,0.7);
            transition: left 0.3s cubic-bezier(0.25, 1, 0.5, 1);
            z-index: 1000;
            padding: 20px;
            display: flex;
            flex-direction: column;
        }

        /* กลไกเมื่อเมาส์ Hover ที่พื้นที่ดักจับ หรือที่ตัว Sidebar ให้สไลด์เมนูออกมา */
        .sidebar-trigger:hover + #sidebar,
        #sidebar:hover {
            left: 0;
        }

        #sidebar h2 {
            color: orange;
            text-align: center;
            font-size: 20px;
            margin-bottom: 10px;
            padding-bottom: 10px;
            border-bottom: 1px solid #333;
        }

        /* 🔘 แถบเลือกหมวดหมู่ (Category Filter Container) */
        #category-filter {
            display: flex;
            gap: 6px;
            overflow-x: auto;
            padding-bottom: 10px;
            margin-bottom: 10px;
            border-bottom: 1px solid #333;
        }

        #category-filter::-webkit-scrollbar {
            height: 4px;
        }
        #category-filter::-webkit-scrollbar-thumb {
            background: #444;
            border-radius: 2px;
        }

        /* ปุ่มเลือกหมวดหมู่แต่ละปุ่ม */
        .cat-btn {
            background: #2a2a2a;
            color: #ccc;
            border: 1px solid #444;
            padding: 6px 12px;
            border-radius: 15px;
            font-size: 12px;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s;
        }

        .cat-btn:hover {
            background: #444;
            color: #fff;
        }

        /* ปุ่มหมวดหมู่ที่กำลังถูกเลือก */
        .cat-btn.active {
            background: orange;
            color: #000;
            font-weight: bold;
            border-color: orange;
        }

        /* 📜 รายการกล่องช่องทีวี */
        #channel-list {
            flex-grow: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
            padding-right: 5px;
        }

        /* ปรับแต่งความสวยงามของ Scrollbar บนเมนู */
        #channel-list::-webkit-scrollbar {
            width: 6px;
        }
        #channel-list::-webkit-scrollbar-thumb {
            background: #444;
            border-radius: 3px;
        }

        /* 🏷️ ตกแต่งหัวข้อหมวดหมู่ */
        .category-title {
            color: #ff9800;
            font-size: 14px;
            font-weight: bold;
            padding: 10px 5px 5px 5px;
            margin-top: 5px;
            border-bottom: 1px dashed #444;
            text-transform: uppercase;
        }
        .category-title:first-child {
            margin-top: 0;
        }

        /* 🔳 ปุ่มช่องทีวีแต่ละช่อง */
        .channel {
            cursor: pointer;
            padding: 10px;
            background: #222;
            border: 1px solid #444;
            border-radius: 8px;
            text-align: center;
            width: 100%;
            min-height: 70px;
            display: flex;
            justify-content: flex-start;
            align-items: center;
            transition: all 0.2s;
            overflow: hidden;
            gap: 12px;
        }
        .channel img {
            width: 50px;
            height: 40px;
            object-fit: contain;
            display: block;
            background: #111;
            border-radius: 4px;
        }
        .channel-name {
            font-size: 15px;
            text-align: left;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .channel:hover, .channel:focus {
            background: orange;
            color: black;
            border-color: #fff;
            transform: scale(1.02);
            outline: none;
        }
    </style>

        function loadPlayer(channel) {
            const config = {
                file: channel.file,
                width: "100%",
                height: "100%",
                autostart: true,
                mute: false
            };

            if (channel.drm) {
                config.type = "dash";
                config.drm = {
                    clearkey: {
                        keyId: channel.keyId,
                        key: channel.key
                    }
                };
            } else {
                config.type = "hls";
            }

            jwplayer("player").setup(config);
        }

        // --- ส่วนการจัดการหมวดหมู่และการกรองข้อมูล (Category Filtering) ---
        const channelList = document.getElementById("channel-list");
        const categoryFilter = document.getElementById("category-filter");

        // 1. นำข้อมูล channels มาจัดกลุ่ม
        const groupedChannels = channels.reduce((acc, channel) => {
            const cat = channel.category || "ช่องทั่วไป";
            if (!acc[cat]) acc[cat] = [];
            acc[cat].push(channel);
            return acc;
        }, {});

        // 2. ฟังก์ชันเรนเดอร์ช่องทีวี (กรองตาม selectedCategory)
        function renderChannels(selectedCategory = 'ALL') {
            channelList.innerHTML = ''; // ล้างรายการเก่า
            let itemIndex = 1;

            for (const category in groupedChannels) {
                // ถ้าไม่ใช่หมวดหมู่ที่เลือก (และไม่ใช่แสดงทั้งหมด 'ALL') ให้ข้ามไป
                if (selectedCategory !== 'ALL' && category !== selectedCategory) {
                    continue;
                }

                // สร้างหัวข้อหมวดหมู่
                const catHeader = document.createElement("div");
                catHeader.className = "category-title";
                catHeader.textContent = category;
                channelList.appendChild(catHeader);

                // สร้างปุ่มช่องทีวี
                groupedChannels[category].forEach((channel) => {
                    const div = document.createElement("div");
                    div.className = "channel";
                    div.tabIndex = itemIndex++;

                    const logoHtml = channel.logo 
                        ? `<img src="${channel.logo}" alt="${channel.name}">`
                        : `<div style="width:50px; height:40px; background:#333; border-radius:4px; display:flex; justify-content:center; align-items:center; font-size:10px; color:#aaa;">No Pix</div>`;

                    div.innerHTML = logoHtml + `<span class="channel-name">${channel.name}</span>`;

                    div.onclick = () => loadPlayer(channel);
                    div.addEventListener('keydown', (e) => {
                        if (e.key === 'Enter') loadPlayer(channel);
                    });

                    channelList.appendChild(div);
                });
            }
        }

        // 3. ฟังก์ชันสร้างปุ่มกรองหมวดหมู่ด้านบน (Category Buttons)
        function renderCategoryButtons() {
            categoryFilter.innerHTML = '';

            // ปุ่ม "ทั้งหมด"
            const allBtn = document.createElement('button');
            allBtn.className = 'cat-btn active';
            allBtn.textContent = 'ทั้งหมด';
            allBtn.onclick = () => {
                document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
                allBtn.classList.add('active');
                renderChannels('ALL');
            };
            categoryFilter.appendChild(allBtn);

            // ปุ่มหมวดหมู่ตามข้อมูลจริง
            for (const category in groupedChannels) {
                const btn = document.createElement('button');
                btn.className = 'cat-btn';
                btn.textContent = category;
                btn.onclick = () => {
                    document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    renderChannels(category); // เรนเดอร์เฉพาะหมวดหมู่ที่กดเลือก
                };
                categoryFilter.appendChild(btn);
            }
        }

        // เริ่มต้นการทำงาน
        renderCategoryButtons();
        renderChannels('ALL'); // เริ่มต้นแสดงทุกช่อง

        // เล่นช่องแรกทันทีเมื่อเปิดหน้าเว็บ
        if (channels.length > 0) {
